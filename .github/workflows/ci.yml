name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new advisories and yanked crates show up between pull requests.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag each one had is noted); Dependabot
# proposes updates (.github/dependabot.yml).
jobs:
  build:
    name: Check, lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  release-tests:
    name: Test (Windows, release profile)
    # Overflow checks are off in release builds, so wrapping bugs can behave differently there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-features --release

  supply-chain:
    name: Dependency policy
    # Both tools only read Cargo.lock and crate metadata; deny.toml limits checks to Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      # Fails on vulnerabilities; the Unix-only unmaintained crates are reported as warnings.
      - run: cargo audit
