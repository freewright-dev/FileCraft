[package]
name = "filecraft"
version = "0.1.0"
edition = "2024"
description = "Instant file search for Windows: an Everything-style desktop app with NTFS MFT indexing"
license = "GPL-3.0-or-later"

[[bin]]
name = "FileCraft"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui_extras = "0.36"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "gif", "webp"] }
memchr = "2.8"
raw-window-handle = "0.6"
regex = "1.11"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Indexing and searching millions of entries is unbearably slow without optimizations.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
